<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بطاقة تفعيل الاحتياط اليومي</title><style>@page {size:A4; margin:0;}
*{box-sizing:border-box}html,body{padding:0;margin:0;font-family:'Noto Sans Arabic','DejaVu Sans',sans-serif;color:#243444; direction:rtl;}body{font-size:11px}
.session,.front,.cover{position:relative;width:210mm;height:297mm;page-break-after:always;break-after:page;overflow:hidden;background:#fff}
.session{padding:14mm 15mm 11mm;background:linear-gradient(180deg,#fbfdfe 0%,#fff 21%)}
.topline{display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid #cad8db;padding-bottom:3.5mm;gap:10px}.org{font-size:9.5px;line-height:1.85;color:#596e76}.org strong{font-size:10.5px;color:#203f4a}.city{font-weight:400}.brand{text-align:left;padding-top:4px}.brand b{font-size:12px;color:var(--accent)}.brand span{display:block;font-size:9px;color:#78909a;margin-top:3px}
.stripe{margin-top:3.6mm;display:flex;gap:5mm;background:#ecf2f4;border-right:4px solid var(--accent);border-radius:3mm;padding:3mm 3.5mm;font-size:10.5px;color:#52616c}.stripe span:first-child{width:46%}.stripe b{color:#294553;font-weight:700}
.number{display:flex;align-items:center;justify-content:space-between;margin-top:4.5mm;font-size:10px}.session-tag{padding:1.5mm 3mm;background:var(--accent);border-radius:4mm;color:#fff;font-weight:800}.unit-tag{color:#72838b}.session h1{margin:3.1mm 0 4mm;font-size:23px;line-height:1.45;letter-spacing:-.1px;color:#203545}
.info-grid{display:grid;grid-template-columns:1.15fr .75fr .85fr 2fr;gap:2.2mm;margin:0 0 3.7mm}.info-grid>div{border:1px solid #b9cbd1;background:#fff;border-radius:2.3mm;min-height:14mm;padding:1.8mm 2.4mm}.info-grid strong{font-size:9.8px;color:#647580;display:block}.write-field{display:block;min-height:6.2mm;border-bottom:1px solid #93aab4}
.outcomes{display:flex;gap:2.5mm;margin:0 0 3.3mm}.outcomes>div{flex:1;min-height:16.5mm;border-radius:2.2mm;background:#f2f6f7;padding:2.4mm 3.2mm}.outcomes>div:first-child{flex:1.45}.mini-label{display:block;font-size:9.1px;font-weight:700;color:var(--accent)}.outcomes p{margin:1mm 0 0;line-height:1.75;font-size:10.3px}
.timing{display:flex;align-items:center;gap:2mm;padding:2.2mm 1mm;margin-bottom:3.5mm;border-top:1px solid #e2e8eb;border-bottom:1px solid #e2e8eb;font-size:10px}.timing span{display:flex;gap:4px;justify-content:center;flex:1;white-space:nowrap;color:#546875}.timing span b{color:var(--accent)}.timing strong{font-size:9.5px;color:#243d4b;white-space:nowrap}
.box{border:1px solid #d3e0e4;border-radius:3mm;background:#fff;overflow:hidden}.content-box{margin-bottom:3mm;padding:3mm 3.8mm;background:#f7fafb;border-right:3px solid var(--accent)}.kicker{font-size:11.2px;font-weight:800;color:var(--accent);margin-bottom:1.9mm}.kicker small{font-size:9px;color:#82919b;font-weight:500;margin-right:2mm}.passage{font-size:12px;line-height:2.0;margin:0;text-align:justify;text-align-last:right}.lead{font-size:11.8px;line-height:1.95;margin:0}
.activity-box{padding:3mm 3.8mm;margin-bottom:3.2mm}.questions{display:grid;gap:1.6mm;margin-top:1.8mm}.question,.step{display:flex;gap:2.1mm;align-items:flex-start;line-height:1.8;font-size:11.1px;color:#354854}.n{font-weight:800;color:var(--accent);min-width:5mm}.question>span:last-child,.step>span:last-child{flex:1}.quant-list{gap:2.5mm}
.response{padding:2.8mm 3.8mm;height:37mm;margin-top:1.2mm;position:relative;background:#fff !important}.response .kicker{font-size:10.5px;margin-bottom:1mm}.rules{height:24mm;background:#fff !important;display:flex;flex-direction:column;justify-content:space-evenly}.rules .rule{height:7mm;background:#fff !important;border-bottom:1px solid #dce6e8}.output{position:absolute;bottom:0;right:0;left:0;padding:1.3mm 3.7mm;background:#eef3f4;border-top:1px solid #dae5e7;font-size:9.6px;color:#596d74}.output strong{color:#355566}
.exit{display:flex;align-items:flex-start;gap:2mm;margin-top:3.5mm;border-radius:2.5mm;background:#eef4f5;border-right:3px solid var(--accent);padding:2.6mm 3.4mm;line-height:1.7;font-size:10.6px}.exit strong{color:var(--accent);white-space:nowrap}.exit span{flex:1}
.teacher{display:flex;gap:2.3mm;margin-top:3mm;padding:2mm 3mm;line-height:1.6;font-size:9px;color:#74858b;background:#f8fafb;border-radius:2mm}.teacher b{color:#56707d;white-space:nowrap}
.rubric{display:flex;gap:4mm;align-items:center;flex-wrap:wrap;font-size:9.3px;margin-top:3mm;color:#566e77}.rubric span:first-child{font-weight:700;color:#3b5964}.notes{margin-right:auto}
.session footer{position:absolute;bottom:7.4mm;left:15mm;right:15mm;border-top:1px solid #dae3e6;display:flex;justify-content:space-between;padding-top:2.5mm;font-size:8.9px;color:#82939a}
.cover{background:linear-gradient(180deg,#0c4959 0%,#176e7c 82%,#e5f1ef 82.2%,#f7faf9 100%);color:white;padding:24mm 22mm}.cover:before{content:'';position:absolute;top:10mm;left:-25mm;width:85mm;height:85mm;border:1px solid #ffffff50;border-radius:50%}.cover:after{content:'';position:absolute;top:35mm;left:-20mm;width:70mm;height:70mm;border:1px solid #ffffff35;border-radius:50%}.cover-top{font-size:13px;line-height:2.05}.cover-top b{font-size:14px}.cover-middle{position:absolute;top:108mm;right:22mm;left:22mm}.eyebrow{font-size:12.3px;color:#c6e9e6}.cover-middle h1{font-size:46px;line-height:1.4;margin:4mm 0 2mm}.cover-middle p{font-size:16px;line-height:1.8;max-width:125mm}.cover-pills{position:absolute;top:225mm;right:22mm;left:22mm;display:flex;gap:8px;flex-wrap:wrap}.cover-pills span{padding:8px 11px;background:#ffffff20;border:1px solid #b7dad8;border-radius:50px;color:#fff;font-size:10.5px}.cover-footer{position:absolute;bottom:18mm;right:22mm;color:#173d48;font-weight:700;font-size:14px;line-height:2.3}.cover-footer small{font-size:11px;color:#58787c}
.front{padding:23mm 20mm;color:#253b48}.front-title{color:#176b76;font-weight:800;font-size:16px;border-right:6px solid #176b76;padding:5mm;margin-bottom:13mm;background:#e9f3f4}.front h2{font-size:21px;margin:0 0 8mm}.front h3{margin:9mm 0 2mm;font-size:15px;color:#236978}.front p{line-height:2.2;font-size:12px;text-align:justify}.guide-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;margin:12mm 0}.guide-cards>div{border:1px solid #d7e4e8;border-radius:3mm;padding:5mm;min-height:51mm}.guide-cards b{color:#1a6877;font-size:14px}.guide-cards p{font-size:10px;line-height:1.85}.guide-footer{margin-top:20mm;border:1px dashed #88b6b8;text-align:center;padding:5mm;color:#1a6674;font-weight:700;font-size:14px}
.toc table{border-collapse:collapse;width:100%;margin:11mm 0;font-size:11px}.toc td,.toc th{border-bottom:1px solid #d6e5e7;padding:3.3mm 2mm;text-align:right}.toc th{background:#176b76;color:#fff}.toc tr:nth-child(even) td{background:#f2f7f8}.toc td:first-child{font-weight:800;color:#20727d}.summary-count{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;margin-top:12mm}.summary-count>div{background:#eaf4f3;padding:6mm;text-align:center;border-radius:3mm}.summary-count b{display:block;font-size:28px;color:#176b76}.summary-count span{font-size:10px;color:#486b71}.toc-foot{margin-top:8mm;text-align:center;color:#6f818a}

@media screen {.write-field:focus{outline:1.5px solid #17818c;background:#eaf8f7}.session{margin:0 auto;box-shadow:0 1px 10px #00000018}}
.toc table{margin:6.5mm 0 5mm;font-size:10.2px}.toc td,.toc th{padding:2.3mm 1.8mm}.toc .summary-count{margin-top:6mm}.toc .toc-foot{margin-top:4mm}.front.toc{padding-top:19mm}.front.toc>p{font-size:11px;line-height:1.7}.front.toc .front-title{margin-bottom:8mm}

.cover-pills{top:211mm}

/* Version with clear teacher model answers. Original page, question and navigation retained. */
.solved-response{background:#fff8f9 !important;border:1.25px solid #d8a6ae !important;}
.solved-response .kicker{color:#962546;font-weight:800;margin-bottom:2mm;font-size:12px;}
.solved-response .kicker small{color:#9a6d7a;font-size:8.6px;}
.solved-response .solved-text{color:#922442;font-size:11px;font-weight:700;line-height:1.75;text-align:right;direction:rtl;unicode-bidi:plaintext;max-height:25.4mm;overflow:hidden;}
.solved-response .output{background:#fcecef!important;border-top-color:#e8cbd2;color:#7b5360;}
.solved-response .output strong{color:#962546;}
.cover-pills .solved-flag{background:#fff;color:#7a2140;border-color:#fff;}

@page{size:A4 portrait;margin:0}
html,body{direction:rtl;margin:0;padding:0;background:#fff}
body{overflow-x:auto}
#card-status{padding:20px;color:#365865;text-align:center;font:700 14px Tahoma,Arial,sans-serif}
#card-host{position:relative;min-height:297mm}
#card-host .session{margin:0 auto;width:210mm!important;min-width:210mm!important;max-width:210mm!important;height:297mm!important;max-height:297mm!important;min-height:297mm!important;overflow:hidden!important;break-before:auto!important;break-after:auto!important;page-break-after:auto!important;page-break-before:auto!important;flex-shrink:0!important;box-shadow:none!important;background:#fff}
#card-host .session h1{letter-spacing:normal!important;word-spacing:normal!important;line-height:1.7}
#card-host .session .write-field.auto-filled{border:0!important;min-height:6mm;padding:2px 5px;background:#f0f5f6;border-radius:4px;font-weight:700;overflow-wrap:anywhere;white-space:normal;line-height:1.6;color:#163f4b}
#card-host .session .response.has-outcome{height:42mm}
#card-host .session .outcome-description{color:#173c46;font-weight:600;font-size:10.5px;line-height:1.8;direction:rtl;text-align:right;unicode-bidi:plaintext;margin:2mm 0 8mm;white-space:pre-wrap;overflow-wrap:anywhere;max-height:26mm;overflow:hidden}
#card-host .session .rubric{margin-top:3mm;gap:3mm}
#card-host .session .rubric label.verified{font-weight:700;color:#0f6f67;padding:2px 7px;background:#edf8f6;border-radius:6px}
#card-host .session footer{position:absolute!important;bottom:7.4mm!important;left:15mm!important;right:15mm!important;color:#3c6770}
@media print {
 html,body,#card-host{width:210mm!important;height:297mm!important;overflow:hidden!important;padding:0!important;margin:0!important}
 #card-host .session{break-after:auto!important;page-break-after:auto!important;box-shadow:none!important}
 #card-status{display:none!important}
}</style></head><body><div id="card-status">جارٍ تحميل البطاقة الأصلية من قاعدة بيانات منجز...</div><main id="card-host"></main><script>
(function(){"use strict";
var qs=new URLSearchParams(location.search);
var num=Number(qs.get("card")),variant=qs.get("variant")==="solved"?"solved":"activity";
var host=document.getElementById("card-host"),status=document.getElementById("card-status");
function failed(message){status.textContent=message;status.hidden=false;document.body.dataset.cardState="error";window.parent.postMessage({type:"manjaz-card-error",card:num,message:message},"*");}
function replyReady(){document.body.dataset.cardState="ready";status.hidden=true;window.parent.postMessage({type:"manjaz-card-ready",card:num,variant:variant},"*");}
function insertText(el,text){if(!el)return;el.textContent=text||"—";el.removeAttribute("contenteditable");el.removeAttribute("role");el.classList.add("auto-filled");}
function setupActivity(section){
 var data=[qs.get("date")||"",qs.get("period")||"",qs.get("class")||"",qs.get("teacher")||""];
 section.querySelectorAll(".info-grid>div").forEach(function(el,i){insertText(el.querySelector(".write-field"),data[i]);});
 section.querySelectorAll(".teacher,.notes").forEach(function(el){el.remove();});
 section.querySelectorAll(".response .kicker small").forEach(function(el){el.remove();});
 var indicators=(qs.get("checks")||"").split("|").filter(function(x){return ["مشاركة","إجابة مبررة","إنجاز المهمة"].includes(x);});
 var rubric=section.querySelector(".rubric");
 if(rubric){
  rubric.querySelectorAll("label").forEach(function(label){
   var title=label.textContent.replace(/^[□☑✓✔]\s*/,"").trim();
   if(!indicators.includes(title))label.remove();
   else {label.textContent="✓ "+title;label.classList.add("verified");}
  });
  if(!indicators.length)rubric.remove();
 }
 var reply=section.querySelector(".response"),description=(qs.get("outcome")||"").trim();
 if(reply){
  var dotted=reply.querySelector(".rules");if(dotted)dotted.remove();
  if(description){
   var p=document.createElement("p");p.className="outcome-description";p.textContent=description;
   var output=reply.querySelector(".output");reply.insertBefore(p,output||null);
   reply.classList.add("has-outcome");
  }else reply.classList.add("no-outcome");
 }
 var stamp=section.querySelector(".brand span");if(stamp)stamp.textContent="بطاقة تنفيذ معبأة";
}
async function run(){
 if(!Number.isInteger(num)||num<1||num>130){failed("رقم البطاقة غير صحيح.");return;}
 try{
  var endpoint="https://idkjuqfxcweqekdkcktk.supabase.co/rest/v1/manjaz_activation_card_templates?card_id=eq."+num+"&variant=eq."+variant+"&select=card_html&limit=1";
  var resp=await fetch(endpoint,{headers:{"apikey":"sb_publishable_3yW3waOwoT0m5XtTCi1lyQ_6DGfXtIL"},cache:"no-store"});
  if(!resp.ok)throw Error("استجابة قاعدة البيانات "+resp.status);
  var items=await resp.json();if(!items.length||!items[0].card_html)throw Error("البطاقة غير موجودة في قاعدة البيانات");
  var tpl=document.createElement("template");tpl.innerHTML=items[0].card_html.trim();
  var sec=tpl.content.querySelector(".session");if(!sec)throw Error("تعذر قراءة التصميم الأصلي للبطاقة");
  host.replaceChildren(sec);
  if(variant==="activity")setupActivity(sec);
  document.title=(variant==="solved"?"بطاقة الحل النموذجي":"بطاقة تفعيل الاحتياط")+" | "+num;
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  replyReady();
 }catch(e){failed("تعذر تحميل البطاقة: "+(e&&e.message||String(e)));}
}
run();
})();</script></body></html>
