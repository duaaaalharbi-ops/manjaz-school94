  <template id="addTpl">
    <section class="page-intro">
      <div>
        <span class="kicker">إضافة منجز</span>
        <h2>توثيق منجز جديد</h2>
        <p>أدخلي البيانات الأساسية والشواهد ثم أرسليها للمراجعة</p>
      </div>
    </section>

    <form id="achievementForm" class="surface form-card">
      <div class="form-section-title">بيانات المنجز</div>
      <div class="form-grid">
        <label>اسم المنجز *
          <input name="title" required>
        </label>
        <label>القسم / المجال *
          <select name="category" required>
            <option value="">اختاري القسم</option>
            <option>الإدارة المدرسية</option>
            <option>التعليم والتعلم</option>
            <option>نواتج التعلم</option>
            <option>البيئة المدرسية</option>
            <option>المجتمع المحلي</option>
            <option>قصص ملهمة</option>
            <option>التكريمات والحوافز</option>
            <option>البرامج والمبادرات</option>
            <option>الشراكات</option>
          </select>
        </label>
        <label>تاريخ التنفيذ *
          <input name="date" type="date" required>
        </label>
        <label>الجهة المنفذة *
          <input name="entity" required>
        </label>
        <label>اسم المنفذة / الفريق *
          <input name="team" required>
        </label>
        <label>الفئة المستهدفة *
          <input name="audience" required>
        </label>
        <label>عدد المستفيدات
          <input name="beneficiaries" type="number" min="0">
        </label>
        <label>نوع المنجز *
          <select name="type" required>
            <option value="">اختاري النوع</option>
            <option>مبادرة</option>
            <option>برنامج</option>
            <option>ورشة</option>
            <option>تكريم</option>
            <option>شراكة</option>
            <option>تقرير</option>
            <option>أخرى</option>
          </select>
        </label>
        <label class="wide">الهدف من المنجز *
          <textarea name="goal" required></textarea>
        </label>
        <label class="wide">وصف مختصر *
          <textarea name="description" required></textarea>
        </label>
        <label class="wide">الأثر / النتيجة *
          <textarea name="impact" required></textarea>
        </label>
      </div>

      <div class="form-section-title">الشواهد والمرفقات</div>
      <div class="form-grid">
        <label>رفع الصور
          <input name="images" type="file" accept="image/*" multiple>
        </label>
        <label>رفع PDF أو مستند
          <input name="documents" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx" multiple>
        </label>
        <label class="wide">رابط خارجي
          <input name="link" type="url" placeholder="https://">
        </label>
        <p class="upload-note wide">تُستخدم أول صورة مرفوعة كصورة غلاف مصغرة تلقائيًا ويمكن إضافة مرفقات لاحقًا من صفحة التفاصيل</p>
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" type="submit">إرسال المنجز</button>
        <button class="btn btn-ghost" type="reset">إلغاء</button>
      </div>
      <div id="formMsg"></div>
    </form>
